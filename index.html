<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR 코드 생성기</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 2rem 1rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-align: center;
      color: #333;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 0.6rem 1rem;
      margin: 0.3rem;
      border: none;
      background: #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-btn.active {
      background: #0066ff;
      color: white;
    }

    .form-section {
      display: none;
      width: 100%;
      max-width: 400px;
    }

    .form-section.active {
      display: block;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button.generate {
      width: 100%;
      max-width: 400px;
      padding: 0.75rem;
      font-size: 1rem;
      background-color: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1rem;
    }

    .hint {
      font-size: 0.85rem;
      color: #666;
      margin: 0 0 0.5rem;
    }

    .error {
      color: #c00000;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      width: 100%;
      max-width: 400px;
    }

    .short-result {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 1.5rem;
      gap: 0.5rem;
    }

    .short-result.active {
      display: flex;
    }

    .short-result input {
      margin: 0;
      flex: 1;
      min-width: 0;
      background: #fff;
    }

    .short-result button {
      min-height: 44px;
      padding: 0 1rem;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }

    #qrcode-container {
      margin-top: 2rem;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #qrcode {
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      input, button, select { font-size: 0.95rem; padding: 0.65rem; }
    }
  </style>
</head>
<body>
  <h1>QR 코드 생성기</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('text')">일반 텍스트</button>
    <button class="tab-btn" onclick="switchTab('wifi')">Wi-Fi 연결</button>
    <button class="tab-btn" onclick="switchTab('short')">단축 링크</button>
  </div>

  <!-- 일반 텍스트 입력 -->
  <div class="form-section active" id="form-text">
    <input type="text" id="text-input" placeholder="텍스트 또는 URL 입력" />
  </div>

  <!-- Wi-Fi 입력 -->
  <div class="form-section" id="form-wifi">
    <input type="text" id="ssid" placeholder="Wi-Fi SSID" />
    <input type="password" id="password" placeholder="비밀번호" />
    <select id="encryption">
      <option value="WPA">WPA/WPA2</option>
      <option value="WEP">WEP</option>
      <option value="nopass">암호 없음</option>
    </select>
  </div>

  <!-- 단축 링크 입력 -->
  <div class="form-section" id="form-short">
    <input type="url" id="long-url" placeholder="줄일 주소 (https://...)" inputmode="url" autocomplete="off" />
    <input type="text" id="alias" placeholder="원하는 이름 (선택)" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <p class="hint">이름은 영문·숫자·밑줄(_) 5~30자. 비우면 자동으로 정해집니다. 예) is.gd/<b>science_3_1</b></p>
  </div>

  <button class="generate" id="generate-btn" onclick="generateQRCode()">QR 코드 생성</button>

  <div class="error" id="error" role="alert"></div>

  <div class="short-result" id="short-result">
    <input type="text" id="short-url" readonly aria-label="단축 링크" />
    <button type="button" id="copy-btn" onclick="copyShortUrl()">복사</button>
  </div>

  <div id="qrcode-container">
    <div id="qrcode"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    let currentTab = 'text';

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(section => section.classList.remove('active'));

      document.getElementById(`form-${type}`).classList.add('active');
      event.target.classList.add('active');

      currentTab = type;
      document.getElementById("generate-btn").textContent =
        type === 'short' ? "단축 링크 만들기" : "QR 코드 생성";
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("short-result").classList.remove("active");
      showError("");
    }

    function showError(msg) {
      document.getElementById("error").textContent = msg;
    }

    // 주소 앞에 http(s)://가 없으면 붙인다
    function normalizeUrl(url) {
      url = url.trim();
      if (url && !/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = "https://" + url;
      return url;
    }

    // is.gd 규칙: 영문·숫자·밑줄 5~30자
    function aliasError(alias) {
      if (!alias) return "";
      if (!/^[A-Za-z0-9_]+$/.test(alias)) return "이름에는 영문·숫자·밑줄(_)만 쓸 수 있습니다.";
      if (alias.length < 5) return "이름은 5자 이상이어야 합니다.";
      if (alias.length > 30) return "이름은 30자 이하여야 합니다.";
      return "";
    }

    function shortenErrorMessage(data) {
      if (data.errorcode === 1) return "주소가 올바르지 않습니다. 주소를 다시 확인하세요.";
      if (data.errorcode === 2 && /exists/.test(data.errormessage)) return "이미 쓰이고 있는 이름입니다. 다른 이름을 넣으세요.";
      if (data.errorcode === 3) return "요청이 너무 많습니다. 잠시 뒤에 다시 시도하세요.";
      return "단축하지 못했습니다: " + (data.errormessage || "알 수 없는 오류");
    }

    async function shortenUrl(longUrl, alias) {
      const params = new URLSearchParams({ format: "json", url: longUrl });
      if (alias) params.set("shorturl", alias);
      const res = await fetch("https://is.gd/create.php?" + params.toString());
      const data = await res.json();
      if (!data.shorturl) throw new Error(shortenErrorMessage(data));
      return data.shorturl;
    }

    async function copyShortUrl() {
      const field = document.getElementById("short-url");
      const btn = document.getElementById("copy-btn");
      try {
        await navigator.clipboard.writeText(field.value);
      } catch (e) {
        field.select();
        document.execCommand("copy");
      }
      btn.textContent = "복사됨";
      setTimeout(() => { btn.textContent = "복사"; }, 1500);
    }

    async function generateQRCode() {
      const container = document.getElementById("qrcode");
      container.innerHTML = ""; // 기존 QR 제거
      showError("");

      let qrData = "";

      if (currentTab === 'text') {
        const text = document.getElementById("text-input").value.trim();
        if (!text) return alert("텍스트를 입력하세요.");
        qrData = text;
      } else if (currentTab === 'wifi') {
        const ssid = document.getElementById("ssid").value.trim();
        const pass = document.getElementById("password").value.trim();
        const enc = document.getElementById("encryption").value;

        if (!ssid) return alert("SSID를 입력하세요.");
        if (enc !== "nopass" && !pass) return alert("비밀번호를 입력하세요.");

        qrData = `WIFI:T:${enc};S:${ssid};P:${pass};;`;
      } else {
        const longUrl = normalizeUrl(document.getElementById("long-url").value);
        const alias = document.getElementById("alias").value.trim();
        const result = document.getElementById("short-result");
        const btn = document.getElementById("generate-btn");
        result.classList.remove("active");

        if (!longUrl) return showError("줄일 주소를 입력하세요.");
        const err = aliasError(alias);
        if (err) return showError(err);

        btn.disabled = true;
        btn.textContent = "만드는 중…";
        try {
          qrData = await shortenUrl(longUrl, alias);
        } catch (e) {
          return showError(e instanceof TypeError ? "단축 서비스에 연결하지 못했습니다. 인터넷 연결을 확인하세요." : e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "단축 링크 만들기";
        }
        document.getElementById("short-url").value = qrData;
        result.classList.add("active");
      }

      new QRCode(container, {
        text: qrData,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
